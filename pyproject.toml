[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiprag"
version = "0.1.0"
description = "Sistema RAG 100% offline para documentación técnica y emergencias de buque"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ShipRAG" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pyyaml>=6.0.1",
  "numpy>=1.26.0",
  "scikit-learn>=1.5.0",
  "rank-bm25>=0.2.2",
  "chromadb>=0.5.5",
  "sentence-transformers>=3.0.0",
  "pymupdf>=1.24.0",
  "pdfplumber>=0.11.0",
  "pillow>=10.4.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "jinja2>=3.1.4",
  "orjson>=3.10.0",
  "tqdm>=4.66.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
llm = ["llama-cpp-python>=0.2.90"]
dev = ["pytest>=8.3.0", "pytest-cov>=5.0.0", "ruff>=0.6.0"]

[project.scripts]
shiprag = "shiprag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "eval"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
