# Perfil SERVER — producción a bordo (tier pesado)
# Distinto de workstation (banco de pruebas ~12GB VRAM).
# Stack objetivo: BGE-M3 + bge-reranker-v2-m3 + Qwen3-32B Q4_K_M.
# Si el hardware del buque no aguanta, fallback_name_or_path apunta al stack workstation.

profile:
  id: server
  label: Server (producción a bordo)
  description: >
    Tier de producción a bordo. Embeddings/reranker/LLM pesados.
    Requiere pesos en models/ antes de zarpar. Si falla la carga del stack
    primario, cae automáticamente al stack workstation (e5-base + bge-base + Qwen2.5-7B).

paths:
  index_dir: data/indexes/server

models:
  embedding:
    backend: auto
    name_or_path: models/embeddings/bge-m3
    fallback: hash
    fallback_name_or_path: models/embeddings/multilingual-e5-base
    device: cuda
    normalize: true
    dim: 1024
  reranker:
    backend: auto
    name_or_path: models/reranker/bge-reranker-v2-m3
    fallback: lexical
    fallback_name_or_path: models/reranker/bge-reranker-base
    device: cuda
  llm:
    # Pon enabled: true solo cuando el GGUF esté en models/llm/
    enabled: true
    name_or_path: models/llm/qwen3-32b-instruct-q4_k_m.gguf
    fallback_name_or_path: models/llm/qwen2.5-7b-instruct-q4_k_m.gguf
    n_ctx: 8192
    n_gpu_layers: 60
    temperature: 0.1
    max_tokens: 512
  verifier:
    backend: auto
    name_or_path: models/verifier/mDeBERTa-v3-base-mnli-xnli
    fallback: lexical
    device: cpu
    entailment_threshold: 0.5
    emergency_entailment_threshold: 0.65

retrieval:
  lexical_top_k: 50
  dense_top_k: 50
  rerank_top_k: 10
  min_evidence_score: 0.2
  emergency_min_evidence_score: 0.3

ocr:
  enabled: true

generation:
  default_mode: auto
  emergency_mode: extractive
  grounding_threshold: 0.4
  emergency_grounding_threshold: 0.6
