# Perfil SERVER — estación de trabajo / servidor a bordo con más RAM/GPU
# Pensado para embeddings/reranker de calidad y LLM GGUF opcional.

profile:
  id: server
  label: Server (alto cómputo)
  description: >
    Calidad operativa. Requiere pesos descargados en models/ antes de zarpar.
    Puede usar GPU si device=cuda y hay drivers.

paths:
  index_dir: data/indexes/server

models:
  embedding:
    backend: auto
    name_or_path: models/embeddings/multilingual-e5-base
    fallback: hash
    device: cpu   # cambiar a cuda si hay GPU
    normalize: true
    dim: 768
  reranker:
    backend: auto
    name_or_path: models/reranker/bge-reranker-base
    fallback: lexical
    device: cpu   # cambiar a cuda si hay GPU
  llm:
    enabled: false  # poner true solo si hay GGUF local
    name_or_path: models/llm/model.gguf
    n_ctx: 4096
    n_gpu_layers: 0  # >0 si GPU + llama-cpp compilado con CUDA/Metal
    temperature: 0.1
    max_tokens: 512

retrieval:
  lexical_top_k: 50
  dense_top_k: 50
  rerank_top_k: 10
  min_evidence_score: 0.2
  emergency_min_evidence_score: 0.3

ocr:
  enabled: true

generation:
  default_mode: auto
  emergency_mode: extractive
  grounding_threshold: 0.4
  emergency_grounding_threshold: 0.6
